name: Build & Publish

# Every push to main and every pull request: build + test.
# Pushing a tag like v0.1.0: also pack with that version and publish to nuget.org.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  id-token: write   # nuget.org Trusted Publishing (OIDC)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test TestProject/TestProject.csproj -c Release --no-build

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: dotnet pack EngineeringFluids/EngineeringFluids.csproj -c Release -o nupkg -p:Version=${GITHUB_REF_NAME#v}

      - name: NuGet login (Trusted Publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: dotnet nuget push "nupkg/*.nupkg" --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
