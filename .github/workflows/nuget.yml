name: Build & Publish

# Every push to main: build, test, pack and publish to nuget.org.
# Pull requests: build and test only.
# Version = <Version> in EngineeringFluids.csproj with the last number replaced by the run number (0.1.$(BuildNumber)).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # nuget.org Trusted Publishing (OIDC)

env:
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -p:BuildNumber=${{ github.run_number }}
      - run: dotnet test TestProject/TestProject.csproj -c Release --no-build

      - name: Pack
        if: env.PUBLISH == 'true'
        run: dotnet pack EngineeringFluids/EngineeringFluids.csproj -c Release --no-build -o nupkg -p:BuildNumber=${{ github.run_number }}

      - name: NuGet login (Trusted Publishing)
        if: env.PUBLISH == 'true'
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: env.PUBLISH == 'true'
        shell: bash
        run: dotnet nuget push "nupkg/*.nupkg" --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
